services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./vdo.ninja:/srv/vdo:ro          # cloned by setup.sh
      - ../site:/srv/site:ro
      - caddy_data:/data

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host                   # TURN needs a big UDP relay range
    command:
      - -n
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP}
      - --realm=${TURN_DOMAIN}
      - --lt-cred-mech
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --fingerprint
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  caddy_data:
