name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/festive-bohr-dq7yfe]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: pick up VDO.Ninja updates
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (studio page + VDO.Ninja at /app/)
        run: |
          mkdir _site
          cp -r site/. _site/
          git clone --depth 1 https://github.com/steveseguin/vdo.ninja.git _site/app
          rm -rf _site/app/.git _site/app/.github
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
